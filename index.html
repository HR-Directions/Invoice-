<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>فواتير المشتريات</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{font-family:tahoma;background:#f5f5f5;padding:15px}
h2{background:#444;color:#fff;padding:8px}
input,select,button{padding:6px;margin:4px}
table{width:100%;border-collapse:collapse}
td,th{border:1px solid #000;text-align:center}
.receipt{width:280px;font-size:12px;border:1px dashed #000;padding:5px;margin:5px}
</style>
</head>
<body>

<h1>🧾 فواتير المشتريات</h1>

<h2>➕ فاتورة جديدة</h2>

<input type="date" id="invDate" onchange="setDay()">
<input id="invDay" disabled placeholder="اليوم">

<select id="supplier"></select>
<input id="notes" placeholder="ملاحظات">

<hr>

<select id="product"></select>
<input id="qty" type="number" placeholder="كمية">
<input id="bonus" type="number" placeholder="بونص">
<input id="buyPrice" type="number" placeholder="سعر الشراء">
<button onclick="addItem()">إضافة</button>

<table>
<thead>
<tr>
<th>الصنف</th><th>كمية</th><th>سعر الجمهور</th>
<th>سعر الشراء</th><th>خصم %</th>
</tr>
</thead>
<tbody id="items"></tbody>
</table>

<p>إجمالي الجمهور: <span id="tp">0</span></p>
<p>إجمالي الشراء: <span id="tb">0</span></p>
<p><b>الصافي: <span id="net">0</span></b></p>

<button onclick="saveInvoice()">💾 حفظ</button>

<hr>

<h2>📂 فواتير سابقة</h2>
<div id="oldInvoices"></div>
  <button onclick="window.open('https://sites.google.com/view/p-na3ma/%D8%A7%D9%84%D8%A7%D8%B5%D9%86%D8%A7%D9%81','_blank')" 
style="padding:10px 20px;background:#1e88e5;color:white;border:none;border-radius:6px;cursor:pointer;">
الذهاب للطباعة 
  </button>

  <button onclick="window.open('https://sites.google.com/view/p-na3ma/%D8%B7%D8%A8%D8%A7%D8%B9%D8%A9?read_current=1','_blank')" 
style="padding:10px 20px;background:#1e88e5;color:white;border:none;border-radius:6px;cursor:pointer;">
الذهاب للطباعة 
  </button>
<script>
const firebaseConfig={
  databaseURL:"https://system-ph-77a0a-default-rtdb.firebaseio.com/"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

let products={},itemsArr=[];

db.ref("products").on("value",s=>{
  products=s.val()||{};
  product.innerHTML="";
  for(let id in products){
    product.innerHTML+=`<option value="${id}">${products[id].name}</option>`;
  }
});

db.ref("suppliers").on("value",s=>{
  supplier.innerHTML="";
  const d=s.val()||{};
  for(let id in d){
    supplier.innerHTML+=`<option>${d[id].name}</option>`;
  }
});

function setDay(){
  const d=new Date(invDate.value);
  invDay.value=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"][d.getDay()];
}

function addItem(){
  const p=products[product.value];
  const discount=((p.publicPrice-buyPrice.value)/p.publicPrice*100).toFixed(2);
  itemsArr.push({
    name:p.name,
    qty:+qty.value,
    publicPrice:p.publicPrice,
    buyPrice:+buyPrice.value,
    discount
  });
  render();
}

function render(){
  items.innerHTML="";
  let tpv=0,tbv=0;
  itemsArr.forEach(i=>{
    tpv+=i.publicPrice*i.qty;
    tbv+=i.buyPrice*i.qty;
    items.innerHTML+=`
    <tr>
      <td>${i.name}</td>
      <td>${i.qty}</td>
      <td>${i.publicPrice}</td>
      <td>${i.buyPrice}</td>
      <td>${i.discount}%</td>
    </tr>`;
  });
  tp.innerText=tpv;
  tb.innerText=tbv;
  net.innerText=tbv;
}

function saveInvoice(){
  db.ref("purchaseInvoices").push({
    date:invDate.value,
    day:invDay.value,
    supplier:supplier.value,
    notes:notes.value,
    items:itemsArr,
    netTotal:net.innerText
  });
  alert("تم الحفظ ✔");
  itemsArr=[]; render();
}

db.ref("purchaseInvoices").on("value",s=>{
  oldInvoices.innerHTML="";
  const d=s.val()||{};
  for(let id in d){
    oldInvoices.innerHTML+=`
    <div class="receipt">
    تاريخ: ${d[id].date}<br>
    مورد: ${d[id].supplier}<br>
    صافي: ${d[id].netTotal}
    </div>`;
  }
});

</script>

</body>
</html>
