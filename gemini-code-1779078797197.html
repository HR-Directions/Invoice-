<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة فواتير المشتريات</title>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #1e88e5;
            --secondary: #0d47a1;
            --success: #2e7d32;
            --danger: #d32f2f;
            --dark: #333;
            --light: #f4f6f9;
            --border: #ccc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tahoma', 'Segoe UI', sans-serif; }

        body { background: var(--light); color: var(--dark); padding: 20px; }

        .container { max-width: 1200px; margin: auto; }

        /* Typography & Headers */
        h1, h2, h3 { color: var(--secondary); margin-bottom: 15px; }
        .header-title { display: flex; align-items: center; gap: 10px; margin-bottom: 30px; font-size: 24px; border-bottom: 2px solid var(--primary); padding-bottom: 10px; }

        /* Cards & Sections */
        .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        
        /* Grid Layouts */
        .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; align-items: end; }

        /* Inputs & Buttons */
        label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #555; }
        input, select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 5px; outline: none; transition: 0.3s; }
        input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 5px rgba(30,136,229,0.2); }
        input:disabled { background: #e9ecef; cursor: not-allowed; }

        button { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--secondary); }
        .btn-success { background: var(--success); color: #fff; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); }
        
        /* Tables */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid var(--border); padding: 12px; text-align: center; }
        th { background: var(--secondary); color: #fff; font-size: 14px; }
        tbody tr:nth-child(even) { background: #f9f9f9; }

        /* Totals Area */
        .totals-bar { display: flex; justify-content: space-between; background: #e3f2fd; padding: 15px; border-radius: 5px; margin-top: 20px; font-size: 16px; font-weight: bold; border: 1px solid #bbdefb; }
        .net-total { color: var(--danger); font-size: 20px; }

        /* Modals */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #fff; padding: 25px; border-radius: 8px; width: 90%; max-width: 400px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .close-modal { float: left; font-size: 20px; cursor: pointer; color: var(--danger); }

        /* 80mm Thermal Print Setup */
        .print-area { display: none; }
        
        @media print {
            body * { visibility: hidden; }
            body { background: #fff; margin: 0; padding: 0; }
            .print-area, .print-area * { visibility: visible; }
            .print-area { 
                position: absolute; left: 0; top: 0; 
                width: 80mm; 
                margin: 0; padding: 5mm; 
                font-family: 'Tahoma', sans-serif; 
                font-size: 12px;
                color: #000;
            }
            .print-header { text-align: center; border-bottom: 1px dashed #000; padding-bottom: 5px; margin-bottom: 5px; }
            .print-header h3 { margin: 0 0 5px 0; color: #000; font-size: 16px; }
            .print-table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
            .print-table th, .print-table td { border: none; border-bottom: 1px dashed #000; padding: 4px 0; text-align: right; font-size: 11px; }
            .print-totals { border-top: 1px dashed #000; padding-top: 5px; font-weight: bold; }
            .print-totals div { display: flex; justify-content: space-between; margin-bottom: 3px; }
        }
    </style>
</head>
<body>

<div class="container no-print">
    <div class="header-title">
        <i class="fas fa-file-invoice-dollar"></i>
        <span>إدارة فواتير المشتريات</span>
    </div>

    <div class="card">
        <h2><i class="fas fa-plus-circle"></i> إنشاء فاتورة جديدة</h2>
        
        <div class="grid-2" style="margin-bottom: 20px;">
            <div>
                <label>تاريخ الفاتورة</label>
                <input type="date" id="invDate" onchange="setDay()">
            </div>
            <div>
                <label>اليوم</label>
                <input id="invDay" disabled placeholder="يتم تحديده تلقائياً">
            </div>
            <div>
                <label>المورد</label>
                <div style="display:flex; gap:5px;">
                    <select id="supplier"></select>
                    <button class="btn-outline" onclick="openModal('supplierModal')" title="إضافة مورد جديد"><i class="fas fa-plus"></i></button>
                </div>
            </div>
            <div>
                <label>ملاحظات الفاتورة</label>
                <input id="notes" placeholder="أدخل أي ملاحظات هنا...">
            </div>
        </div>

        <hr style="border:0; border-top:1px solid #eee; margin: 20px 0;">

        <div class="grid-4">
            <div>
                <label>الصنف</label>
                <div style="display:flex; gap:5px;">
                    <select id="product" onchange="autoFillPrice()"></select>
                    <button class="btn-outline" onclick="openModal('productModal')" title="إضافة صنف جديد"><i class="fas fa-plus"></i></button>
                </div>
            </div>
            <div>
                <label>الكمية</label>
                <input id="qty" type="number" min="1" placeholder="مثال: 10">
            </div>
            <div>
                <label>بونص (مجاني)</label>
                <input id="bonus" type="number" min="0" value="0" placeholder="مثال: 2">
            </div>
            <div>
                <label>سعر الشراء للقطعة</label>
                <input id="buyPrice" type="number" placeholder="0.00">
            </div>
            <button class="btn-primary" onclick="addItem()" style="height: 40px;"><i class="fas fa-cart-plus"></i> إضافة للفاتورة</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>م</th>
                    <th>الصنف</th>
                    <th>الكمية</th>
                    <th>البونص</th>
                    <th>سعر الجمهور</th>
                    <th>سعر الشراء</th>
                    <th>الخصم %</th>
                    <th>الإجمالي</th>
                    <th>إجراء</th>
                </tr>
            </thead>
            <tbody id="items">
                <tr><td colspan="9" style="text-align:center; color:#777;">لا توجد أصناف مضافة بعد</td></tr>
            </tbody>
        </table>

        <div class="totals-bar">
            <div>إجمالي الجمهور: <span id="tp">0.00</span></div>
            <div>إجمالي الشراء: <span id="tb">0.00</span></div>
            <div class="net-total">الصافي للدفع: <span id="net">0.00</span></div>
        </div>

        <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: flex-end;">
            <button class="btn-success" onclick="saveAndPrintInvoice()"><i class="fas fa-print"></i> حفظ وطباعة (80مم)</button>
            <button class="btn-primary" onclick="saveInvoiceOnly()"><i class="fas fa-save"></i> حفظ الفاتورة</button>
        </div>
    </div>
</div>

<div id="printSection" class="print-area">
    <div class="print-header">
        <h3>فاتورة مشتريات</h3>
        <div id="p-date"></div>
        <div id="p-supplier"></div>
    </div>
    <table class="print-table">
        <thead>
            <tr>
                <th>الصنف</th>
                <th>كمية</th>
                <th>سعر</th>
                <th>إجمالي</th>
            </tr>
        </thead>
        <tbody id="p-items"></tbody>
    </table>
    <div class="print-totals">
        <div><span>الإجمالي:</span> <span id="p-total">0.00</span></div>
        <div style="font-size:10px; text-align:center; margin-top:5px;" id="p-notes"></div>
    </div>
</div>

<div id="productModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeModal('productModal')">&times;</span>
        <h3>إضافة صنف جديد</h3>
        <label>اسم الصنف</label>
        <input type="text" id="newProductName" style="margin-bottom:10px;">
        <label>سعر الجمهور المعتاد</label>
        <input type="number" id="newProductPrice" style="margin-bottom:15px;">
        <button class="btn-primary" onclick="addNewProduct()" style="width:100%;">حفظ الصنف</button>
    </div>
</div>

<div id="supplierModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeModal('supplierModal')">&times;</span>
        <h3>إضافة مورد جديد</h3>
        <label>اسم المورد</label>
        <input type="text" id="newSupplierName" style="margin-bottom:15px;">
        <button class="btn-primary" onclick="addNewSupplier()" style="width:100%;">حفظ المورد</button>
    </div>
</div>

<script>
// Firebase Initialization
const firebaseConfig = {
    databaseURL: "https://system-ph-77a0a-default-rtdb.firebaseio.com/"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let products = {}, itemsArr = [];

// Set default date
document.getElementById('invDate').valueAsDate = new Date();
setDay();

// Load Products
db.ref("products").on("value", s => {
    products = s.val() || {};
    const prodSelect = document.getElementById('product');
    prodSelect.innerHTML = "<option value='' disabled selected>اختر الصنف...</option>";
    for(let id in products) {
        prodSelect.innerHTML += `<option value="${id}">${products[id].name}</option>`;
    }
});

// Load Suppliers
db.ref("suppliers").on("value", s => {
    const supSelect = document.getElementById('supplier');
    supSelect.innerHTML = "<option value='' disabled selected>اختر المورد...</option>";
    const d = s.val() || {};
    for(let id in d) {
        supSelect.innerHTML += `<option value="${d[id].name}">${d[id].name}</option>`;
    }
});

function setDay() {
    const d = new Date(document.getElementById('invDate').value);
    const days = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
    document.getElementById('invDay').value = days[d.getDay()];
}

function autoFillPrice() {
    const pId = document.getElementById('product').value;
    if(products[pId] && products[pId].publicPrice) {
        // Optional: Can prepopulate buy price if you store last buy price
    }
}

function addItem() {
    const prodId = document.getElementById('product').value;
    const q = parseFloat(document.getElementById('qty').value);
    const bPrice = parseFloat(document.getElementById('buyPrice').value);
    const bns = parseFloat(document.getElementById('bonus').value) || 0;

    if(!prodId || isNaN(q) || isNaN(bPrice) || q <= 0) {
        alert("الرجاء إكمال بيانات الصنف والكمية والسعر بشكل صحيح.");
        return;
    }

    const p = products[prodId];
    // Calculate discount based on public price vs buy price
    const pubPrice = p.publicPrice || 0;
    let discount = 0;
    if(pubPrice > 0) {
        discount = (((pubPrice - bPrice) / pubPrice) * 100).toFixed(2);
    }

    itemsArr.push({
        id: prodId,
        name: p.name,
        qty: q,
        bonus: bns,
        publicPrice: pubPrice,
        buyPrice: bPrice,
        discount: discount,
        total: q * bPrice
    });

    // Clear inputs
    document.getElementById('qty').value = '';
    document.getElementById('bonus').value = '0';
    document.getElementById('buyPrice').value = '';
    document.getElementById('product').selectedIndex = 0;
    
    renderTable();
}

function removeItem(index) {
    itemsArr.splice(index, 1);
    renderTable();
}

function renderTable() {
    const tbody = document.getElementById('items');
    tbody.innerHTML = "";
    let tpv = 0, tbv = 0;

    if(itemsArr.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9" style="text-align:center; color:#777;">لا توجد أصناف مضافة</td></tr>`;
        updateTotals(0, 0);
        return;
    }

    itemsArr.forEach((item, index) => {
        tpv += item.publicPrice * item.qty;
        tbv += item.total;
        
        tbody.innerHTML += `
        <tr>
            <td>${index + 1}</td>
            <td>${item.name}</td>
            <td>${item.qty}</td>
            <td>${item.bonus}</td>
            <td>${item.publicPrice}</td>
            <td>${item.buyPrice}</td>
            <td dir="ltr">${item.discount}%</td>
            <td>${item.total.toFixed(2)}</td>
            <td><button class="btn-danger" onclick="removeItem(${index})" style="padding:5px 10px;"><i class="fas fa-trash"></i></button></td>
        </tr>`;
    });

    updateTotals(tpv, tbv);
}

function updateTotals(pubTotal, buyTotal) {
    document.getElementById('tp').innerText = pubTotal.toFixed(2);
    document.getElementById('tb').innerText = buyTotal.toFixed(2);
    document.getElementById('net').innerText = buyTotal.toFixed(2);
}

// Saving & Printing Logic
function buildInvoiceObject() {
    return {
        date: document.getElementById('invDate').value,
        day: document.getElementById('invDay').value,
        supplier: document.getElementById('supplier').value || 'غير محدد',
        notes: document.getElementById('notes').value,
        items: itemsArr,
        netTotal: document.getElementById('net').innerText,
        timestamp: firebase.database.ServerValue.TIMESTAMP
    };
}

function saveInvoiceOnly() {
    if(itemsArr.length === 0) { alert("لا يمكن حفظ فاتورة فارغة!"); return; }
    const inv = buildInvoiceObject();
    db.ref("purchaseInvoices").push(inv).then(() => {
        alert("تم حفظ الفاتورة بنجاح ✔");
        resetForm();
    });
}

function saveAndPrintInvoice() {
    if(itemsArr.length === 0) { alert("لا يمكن طباعة فاتورة فارغة!"); return; }
    
    const inv = buildInvoiceObject();
    
    // 1. Prepare Print Area (80mm)
    document.getElementById('p-date').innerText = `التاريخ: ${inv.date}`;
    document.getElementById('p-supplier').innerText = `المورد: ${inv.supplier}`;
    document.getElementById('p-notes').innerText = inv.notes;
    
    const pItems = document.getElementById('p-items');
    pItems.innerHTML = '';
    itemsArr.forEach(i => {
        pItems.innerHTML += `
        <tr>
            <td>${i.name} <br> <small>بونص: ${i.bonus}</small></td>
            <td>${i.qty}</td>
            <td>${i.buyPrice}</td>
            <td>${i.total.toFixed(2)}</td>
        </tr>`;
    });
    document.getElementById('p-total').innerText = inv.netTotal;

    // 2. Save to DB
    db.ref("purchaseInvoices").push(inv).then(() => {
        // 3. Trigger Print Window
        window.print();
        resetForm();
    });
}

function resetForm() {
    itemsArr = [];
    document.getElementById('notes').value = '';
    renderTable();
}

// Modals Logic
function openModal(id) { document.getElementById(id).style.display = 'flex'; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }

function addNewProduct() {
    const name = document.getElementById('newProductName').value;
    const price = parseFloat(document.getElementById('newProductPrice').value) || 0;
    if(name.trim() === '') { alert('يرجى إدخال اسم الصنف'); return; }
    
    db.ref("products").push({ name: name, publicPrice: price }).then(() => {
        closeModal('productModal');
        document.getElementById('newProductName').value = '';
        document.getElementById('newProductPrice').value = '';
        alert('تمت إضافة الصنف بنجاح!');
    });
}

function addNewSupplier() {
    const name = document.getElementById('newSupplierName').value;
    if(name.trim() === '') { alert('يرجى إدخال اسم المورد'); return; }
    
    db.ref("suppliers").push({ name: name }).then(() => {
        closeModal('supplierModal');
        document.getElementById('newSupplierName').value = '';
        alert('تمت إضافة المورد بنجاح!');
    });
}
</script>

</body>
</html>
